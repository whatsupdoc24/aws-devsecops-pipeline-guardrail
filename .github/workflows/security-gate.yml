name: "DevSecOps Security Gate"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security_scans:
    name: "Run Security Scans"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code into the runner environment
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # Step 3: Set up Python so we can run the Checkov tool
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python_version: "3.11"

      # Step 4: Run Checkov to scan Terraform files for misconfigurations
      - name: "Run Checkov IaC Scanner"
        run: |
          pip install checkov
          checkov -d ./terraform --framework terraform --soft-fail-on LOW,MEDIUM

      # Step 5: Run Trivy to scan the repository filesystem for exposed secrets or vulnerabilities
      - name: "Run Trivy Security Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Forces the step to hard-fail if HIGH or CRITICAL issues exist
          severity: 'HIGH,CRITICAL'
